version: "3.9"

services:
  db:
    image: postgres:16
    container_name: tender_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tender_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tender_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: tender_ai_api
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    container_name: tender_ai_worker
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.celery_app.celery_app worker --loglevel=info

volumes:
  postgres_data: